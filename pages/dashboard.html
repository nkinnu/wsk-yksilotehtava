<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/dashboard.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-content">
        <a class="site-name" href="../index.html">Sivuston nimi</a>

        <nav class="main-nav">
          <a href="../index.html">Ravintolat</a>
          <a href="#favorites">Suosikit</a>
          <a class="login-button" href="profile.html">Oma profiili</a>
          <button id="logout-button" class="login-button" type="button">
            Kirjaudu ulos
          </button>
        </nav>
      </div>
    </header>

    <main class="container">
      <!-- Favorite restaurant selection -->
      <section class="favorite-selection">
        <h1>Valitse suosikkiravintolasi</h1>
        <p>
          Valitse ravintola alla olevasta valikosta ja tallenna se suosikiksesi.
        </p>
      </section>

      <!-- Ravintolahaku -->
      <form id="favorite-form" class="dashboard-search">
        <select id="favorite-select" required>
          <option value="">Valitse suosikkiravintola</option>
        </select>

        <button type="submit">Tallenna suosikiksi</button>
      </form>

      <p id="favorite-message" role="status"></p>

      <!-- Suosikit ja kartta -->
      <div class="dashboard-content">
        <section id="favorites">
          <h2>Suosikkiravintola</h2>
          <div class="favorites-grid"></div>
        </section>

        <!-- Daily menu preview -->
        <section class="daily-menu-section">
          <h2>Päivän ruokalista</h2>
          <div id="daily-menu-preview" class="daily-menu-preview">
            Valitse suosikkiravintolasi nähdäksesi päivän ruokalistan.
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-content">
        <p>Tietoa palvelusta</p>
        <p>Käyttöehdot</p>
      </div>
    </footer>
  </body>
</html>
