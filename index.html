<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opiskelijaravintolat</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/index.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-content">
        <a class="site-name" href="index.html">Sivuston nimi</a>

        <nav class="main-nav">
          <a href="#restaurants">Ravintolat</a>
          <a class="login-button" href="pages/login.html">Kirjaudu sisään</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <h1>Löydä päivän opiskelijalounas</h1>
      <section class="search-section">
        <form class="search-form" role="search">
          <input
            type="search"
            id="restaurant-search"
            placeholder="Hae ravintolan nimellä"
            aria-label="Hae ravintolan nimellä"
          />

          <div class="search-row">
            <select id="city" aria-label="Valitse kaupunki">
              <option value="">Valitse kaupunki</option>
            </select>

            <button type="submit">Hae</button>
          </div>
        </form>
      </section>

      <section id="restaurants">
        <h2>Tutustu ravintoloihin</h2>
        <div class="restaurant-grid"></div>

        <div class="show-all">
          <button id="show-all-button" type="button">
            Näytä kaikki ravintolat &rarr;
          </button>
        </div>
      </section>
      <dialog id="restaurant-dialog">
        <div class="dialog-header">
          <h2 id="dialog-title">Kaikki ravintolat</h2>
          <form method="dialog">
            <button type="submit">Sulje</button>
          </form>
        </div>
        <div id="all-restaurants-list"></div>
      </dialog>
    </main>

    <footer class="site-footer">
      <div class="container footer-content">
        <p>Tietoa palvelusta</p>
        <p>Käyttöehdot</p>
      </div>
    </footer>
  </body>
</html>
